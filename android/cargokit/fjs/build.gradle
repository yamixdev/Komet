group = 'com.flutter_rust_bridge.fjs'
version = '1.0'

apply plugin: 'com.android.library'

android {
    namespace = 'com.flutter_rust_bridge.fjs'
    compileSdk = 35
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdk = 21
    }
    sourceSets.main.setRoot(new File(cargoKitPackageDirectory, 'android/src/main').absolutePath)
}

apply from: rootProject.file('../native/komet_tlottie/cargokit/gradle/plugin.gradle')

cargokit {
    manifestDir = new File(cargoKitPackageDirectory, 'libfjs').absolutePath
    buildToolDirectory = new File(cargoKitPackageDirectory, 'cargokit')
    libname = 'fjs'
}
