name: Pin kolibri crates
description: >
  Install the resolved Rust dependency graph for the published kolibri package
  before an iOS build. The lockfile keeps libc 0.2.189 for Apple mobile targets
  and mio 1.2.4, which accepts that libc version.

runs:
  using: composite
  steps:
    - name: Lock kolibri crates
      shell: bash
      run: |
        set -euo pipefail
        version=$(awk '/^  kolibri:$/ {found=1} found && /^    version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
        crate="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/kolibri-$version/rust"
        lockfile="$GITHUB_ACTION_PATH/kolibri-$version.lock"
        if [[ ! -f "$crate/Cargo.toml" || ! -f "$lockfile" ]]; then
          echo "::error::Missing iOS Cargo lockfile or installed package for kolibri $version"
          exit 1
        fi
        cp "$lockfile" "$crate/Cargo.lock"
        cargo fetch --locked --target aarch64-apple-ios --manifest-path "$crate/Cargo.toml"
